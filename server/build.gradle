plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
    id "dev.rikka.tools.refine"
}

android {
    namespace = "moe.shizuku.server"
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        buildConfigField "String", "MANAGER_APPLICATION_ID", "\"${project(':manager').android.defaultConfig.applicationId}\""
        // Development builds run beside the official Shizuku. Two Shizuku servers on one
        // device must not share state, and a development server must never hand its binder
        // to the user's already-authorised client apps (that would hijack them).
        buildConfigField "boolean", "DEV_IDENTITY", "${project(':manager').android.defaultConfig.applicationId != 'moe.shizuku.privileged.api'}"
        buildConfigField "String", "UPSTREAM_MANAGER_ID", "\"moe.shizuku.privileged.api\""
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.3.0"
    implementation "com.google.code.gson:gson:2.13.1"
    api "dev.rikka.rikkax.parcelablelist:parcelablelist:2.0.1"

    implementation project(":aidl")
    implementation project(":common")
    implementation project(":shared")
    compileOnly project(":provider")
    implementation project(":starter")
    implementation project(":rish")
    implementation project(":server-shared")
    implementation libs.hidden.compat
    compileOnly libs.hidden.stub
}
