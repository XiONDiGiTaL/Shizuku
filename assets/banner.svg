<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Shizuku Reimagined by XiØN">
  <title>Shizuku Reimagined, XiØN</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#3f80ff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#3f80ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3f80ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f80ff"/>
      <stop offset="1" stop-color="#79a8ff"/>
    </linearGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="418" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="30" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- accent rule -->
  <rect x="72" y="96" width="4" height="212" rx="2" fill="url(#accent)"/>

  <!-- shield mark, echoed from the app icon -->
  <g transform="translate(108,88)">
    <circle cx="26" cy="26" r="26" fill="#3f80ff" fill-opacity="0.10"/>
    <circle cx="26" cy="26" r="26" fill="none" stroke="#3f80ff" stroke-opacity="0.35"/>
    <g transform="translate(10,10) scale(1.333)">
      <path fill="#79a8ff" d="M12,1L3,5v6c0,5.55 3.84,10.74 9,12 5.16,-1.26 9,-6.45 9,-12V5l-9,-4zM12,11.99h7c-0.53,4.12 -3.28,7.79 -7,8.94V12H5V6.3l7,-3.11v8.8z"/>
    </g>
  </g>

  <!-- brand overline -->
  <text x="184" y="122"
        font-family="Sora, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" letter-spacing="7" fill="#79a8ff">XiØN</text>

  <!-- wordmark: bold white + italic blue -->
  <text x="176" y="228"
        font-family="Sora, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="88" font-weight="700" letter-spacing="-1.5" fill="#ecedef">
    <tspan>Shizuku</tspan>
    <tspan dx="20"
           font-family="'Instrument Serif', Georgia, 'Times New Roman', serif"
           font-style="italic" font-weight="400"
           letter-spacing="0" fill="url(#accent)">Reimagined</tspan>
  </text>

  <!-- tagline -->
  <text x="184" y="288"
        font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace"
        font-size="19" letter-spacing="0.6" fill="#8b909a">ADB-level access, without the terminal.</text>

  <!-- meta line -->
  <text x="184" y="326"
        font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace"
        font-size="15" letter-spacing="0.4" fill="#5f6672">net.xiondigital.shizuku · v2.0.0-xion · Android 7.0+</text>

  <!-- chips -->
  <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="13" letter-spacing="1.4">
    <rect x="820" y="300" width="150" height="38" rx="19" fill="#3f80ff" fill-opacity="0.10" stroke="#3f80ff" stroke-opacity="0.35"/>
    <text x="895" y="324" text-anchor="middle" fill="#79a8ff">ADB · UID 2000</text>

    <rect x="986" y="300" width="142" height="38" rx="19" fill="#0c0e11" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1057" y="324" text-anchor="middle" fill="#8b909a">ONE UI 9.0</text>
  </g>

  <rect x="72" y="380" width="1056" height="1.5" fill="url(#hairline)"/>
</svg>
